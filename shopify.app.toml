# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "49fbd1efd01a635a5ba20147c65b469c"
name = "vendor-app"
application_url = "https://example.com"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_customers,write_customers"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[metaobjects.app.vendor_profile]
name = "Vendor Profile"
description = "Stores public profile data for each vendor on ArtisanHub"

  [metaobjects.app.vendor_profile.access]
  admin = "merchant_read_write"

[metaobjects.app.vendor_profile.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.vendor_profile.fields.bio]
name = "Bio"
type = "multi_line_text_field"

[metaobjects.app.vendor_profile.fields.country]
name = "Country"
type = "single_line_text_field"

[metaobjects.app.vendor_profile.fields.email]
name = "Email"
type = "single_line_text_field"

[metaobjects.app.vendor_profile.fields.shipping_note]
name = "Shipping Note"
type = "multi_line_text_field"

[metaobjects.app.vendor_profile.fields.founded_year]
name = "Founded Year"
type = "number_integer"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "orders/create", "products/update" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
